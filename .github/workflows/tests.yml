name: Automation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API tests
        if: matrix.suite == 'api'
        run: python -m pytest tests/api -v --junitxml=reports/results.xml
      - name: Run UI and hybrid tests in headless Chrome
        if: matrix.suite == 'browser'
        run: python -m pytest tests/ui tests/e2e -v --junitxml=reports/results.xml
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-test-results
          path: |
            reports/
            screenshots/
          if-no-files-found: warn
          retention-days: 14
